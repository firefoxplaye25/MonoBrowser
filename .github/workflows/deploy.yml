name: MonoLithiiun Auto-Release

on:
  push:
    tags:
      - 'v*' # Dispara quando você cria uma tag de versão, ou...
  workflow_dispatch: # Permite disparar manualmente
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Build EXE
        run: |
          pip install PyQt5 PyQtWebEngine pyinstaller
          pyinstaller --noconfirm --onedir --windowed --icon "Principalappico.ico" --name "MonoLithiiun Explorer" --add-data "*.png;." --add-data "*.ico;." "main.py"

      - name: Zip
        shell: powershell
        run: |
          Compress-Archive -Path "dist/MonoLithiiun Explorer/*" -DestinationPath "MonoLithiiun_Update.zip"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: MonoLithiiun_Update.zip
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          body: "Atualização Automática do MonoLithiiun Explorer"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
