<!DOCTYPE html>
<html>
<head>
    <title>Sem Conexão - Jogo</title>
    <style>
        body { margin: 0; padding: 0; background-color: #202020; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        #gameArea { width: 400px; height: 300px; background-color: #333; position: relative; border: 2px solid #555; overflow: hidden; cursor: pointer; }
        #player { width: 20px; height: 20px; background-color: #007acc; position: absolute; left: 50px; top: 140px; }
        .obstacle { width: 30px; background-color: #F44336; position: absolute; right: 0; }
        #scoreBoard { font-size: 24px; margin-top: 10px; }
    </style>
</head>
<body>
    <h2>Ops! Sem Conexão.</h2>
    <p>Mas você pode jogar enquanto a internet não volta!</p>
    <div id="gameArea" onclick="jump()">
        <div id="player"></div>
    </div>
    <div id="scoreBoard">Pontos: <span id="score">0</span></div>
    
    <script>
        let player = document.getElementById('player');
        let gameArea = document.getElementById('gameArea');
        let scoreSpan = document.getElementById('score');
        let isJumping = false;
        let gravity = 0.9;
        let position = 140;
        let velocity = 0;
        let score = 0;
        let isGameOver = false;

        function jump() {
            if(isGameOver) { location.reload(); return; }
            velocity = -8;
        }

        document.addEventListener('keydown', (e) => { if(e.code === 'Space' || e.code === 'ArrowUp') jump(); });

        function createObstacle() {
            if(isGameOver) return;
            let obstacle = document.createElement('div');
            obstacle.classList.add('obstacle');
            let height = Math.random() * 150 + 20;
            let gap = 80;
            let isTop = Math.random() > 0.5;
            
            obstacle.style.height = height + 'px';
            if(isTop) obstacle.style.top = '0px';
            else obstacle.style.bottom = '0px';
            
            let obstaclePos = 400;
            obstacle.style.left = obstaclePos + 'px';
            gameArea.appendChild(obstacle);
            
            let timer = setInterval(() => {
                if(isGameOver) { clearInterval(timer); return; }
                obstaclePos -= 5;
                obstacle.style.left = obstaclePos + 'px';
                
                // Collision
                let pTop = position;
                let pBottom = position + 20;
                let oLeft = obstaclePos;
                let oRight = obstaclePos + 30;
                
                if (oLeft < 70 && oRight > 50) {
                    if (isTop && pTop < height) gameOver();
                    if (!isTop && pBottom > 300 - height) gameOver();
                }
                
                if (obstaclePos < -30) {
                    clearInterval(timer);
                    gameArea.removeChild(obstacle);
                    score++;
                    scoreSpan.innerText = score;
                }
            }, 20);
            
            setTimeout(createObstacle, Math.random() * 1500 + 1000);
        }

        function gameLoop() {
            if(isGameOver) return;
            velocity += gravity;
            position += velocity;
            if(position > 280) { position = 280; velocity = 0; gameOver(); }
            if(position < 0) { position = 0; velocity = 0; }
            player.style.top = position + 'px';
            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            isGameOver = true;
            alert("Game Over! Pontos: " + score + "\nClique para tentar de novo.");
        }

        gameLoop();
        setTimeout(createObstacle, 1000);
    </script>
</body>
</html>
